name: Build & Release

on:
  push:
    tags:
      - 'v*'        # uruchom tylko dla tagów v1.0, v1.1, itd.
  workflow_dispatch: # możliwość ręcznego uruchomienia

jobs:
  # ============================================================
  #  TESTY
  # ============================================================
  tests:
    name: Testy (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: |
          pip install Pillow PyQt5 exifread pytest
          sudo apt-get install -y python3-pyqt5 libgl1 libglib2.0-0 2>/dev/null || true

      - name: Uruchom testy
        run: python3 -m pytest tests/ -v

  # ============================================================
  #  WINDOWS INSTALLER
  # ============================================================
  build-windows:
    name: Windows Installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: |
          pip install Pillow PyQt5 exifread pyinstaller

      - name: Zbuduj EXE (PyInstaller)
        run: python -m PyInstaller photo_catalog.spec --noconfirm

      - name: Zainstaluj Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Zbuduj instalator (Inno Setup)
        run: |
          mkdir -p dist\installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_windows.iss

      - name: Wgraj instalator jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/KatalogZdjec_Instalator_v*.exe

  # ============================================================
  #  LINUX APPIMAGE
  # ============================================================
  build-appimage:
    name: Linux AppImage
    needs: tests
    runs-on: ubuntu-20.04    # starsza dla maksymalnej zgodności glibc
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności systemowe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxkbcommon-x11-0 fuse libfuse2

      - name: Zainstaluj zależności Python
        run: pip install Pillow PyQt5 exifread pyinstaller

      - name: Zbuduj AppImage
        run: bash build_appimage.sh

      - name: Wgraj AppImage jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: releases/KatalogZdjec-x86_64.AppImage

  # ============================================================
  #  GITHUB RELEASE (tylko przy tagu)
  # ============================================================
  release:
    name: Utwórz GitHub Release
    needs: [build-windows, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz artefakty Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      - name: Pobierz artefakty Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-assets/

      - name: Utwórz Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Katalog Zdjęć ${{ github.ref_name }}"
          body: |
            ## Katalog Zdjęć ${{ github.ref_name }}

            ### Pliki do pobrania
            | Platforma | Plik | Opis |
            |-----------|------|------|
            | 🪟 Windows 10/11 | `KatalogZdjec_Instalator_vX.X.exe` | Instalator Windows |
            | 🐧 Linux x86_64 | `KatalogZdjec-x86_64.AppImage` | Przenośna paczka AppImage |

            ### Linux — uruchomienie AppImage
            ```bash
            chmod +x KatalogZdjec-x86_64.AppImage
            ./KatalogZdjec-x86_64.AppImage
            ```

            ### Windows — instalacja
            Uruchom instalator i postępuj zgodnie z kreatorem.
          files: release-assets/*
          draft: false
          prerelease: false
